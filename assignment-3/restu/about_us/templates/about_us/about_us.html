{% extends 'base.html' %}
{% load static %}
{% block title %}About Us{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{% static 'css/style.css' %}" />{% endblock %}
{% block content %}
<div class="about">
  <div class="container py-5">
    <div class="row align-items-center g-4">
      <div class="pic col-md-6 text-center">
        <img src="{% static 'images/aboutus.jpg' %}" alt="The King's Restora team" class="img-fluid rounded" />
      </div>
      <div class="writing col-md-6">
        <h1>Welcome to King's Restora, where food and community connect.</h1>
        <p class="lead">At King's Restora, we're more than just a place to eat.</p>
        <a href="{% url 'meal' %}" class="btn btn-outline-light btn-lg mt-3">Explore our menu</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
